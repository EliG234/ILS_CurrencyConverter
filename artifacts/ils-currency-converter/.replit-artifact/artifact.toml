kind = "mobile"
previewPath = "/ils-currency-converter/"
title = "ILS Currency Converter"
description = "A focused mobile currency converter that fetches live EUR-based rates from Frankfurter and instantly calculates USD and EUR amounts in Israeli New Shekels."
version = "1.0.0"
id = "artifacts/ils-currency-converter"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/ils-currency-converter/" ]
localPort = 19684

[services.development]
run = "pnpm --filter @workspace/ils-currency-converter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ils-currency-converter", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ils-currency-converter", "run", "serve" ]

[services.env]
PORT = "19684"
BASE_PATH = "/ils-currency-converter/"
